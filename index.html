<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geometry Dash Web Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #080711;
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            color: white;
        }
        .font-pixel {
            font-family: 'Press Start 2P', cursive;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        /* Neon Glow Effects */
        .glow-text-cyan {
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.8), 0 0 20px rgba(6, 182, 212, 0.4);
        }
        .glow-text-yellow {
            text-shadow: 0 0 10px rgba(234, 179, 8, 0.8), 0 0 20px rgba(234, 179, 8, 0.4);
        }
        .glow-box-purple {
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.5), inset 0 0 15px rgba(168, 85, 247, 0.3);
        }
        .btn-neon {
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .btn-neon:hover {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.2);
        }
        .btn-neon:active {
            transform: translateY(1px) scale(0.98);
        }
        /* Scrollbar custom */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #3b82f6;
            border-radius: 4px;
        }
    </style>
</head>
<body class="w-screen h-screen flex flex-col items-center justify-center relative overflow-hidden bg-slate-950">

    <!-- Game Container -->
    <div id="game-container" class="relative w-full h-full max-w-[1280px] max-h-[720px] aspect-video bg-black overflow-hidden sm:rounded-2xl shadow-2xl border border-slate-800/80 flex flex-col justify-center items-center">
        
        <!-- Canvas Rendering Layer -->
        <canvas id="gameCanvas" class="w-full h-full absolute inset-0 z-0"></canvas>

        <!-- In-Game UI Overlay -->
        <div id="inGameUI" class="absolute inset-0 z-10 pointer-events-none flex flex-col justify-between p-4 hidden">
            <!-- Top Bar -->
            <div class="flex justify-between items-center w-full">
                <!-- Practice Mode Controls -->
                <div id="practiceControls" class="flex gap-2 pointer-events-auto opacity-90 transition-opacity">
                    <button id="btnCheckpoint" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 px-3 rounded-lg text-xs md:text-sm shadow-lg flex items-center gap-1 border border-emerald-400/30">
                        <span>+ Checkpoint</span>
                    </button>
                    <button id="btnRemoveCheckpoint" class="bg-rose-600 hover:bg-rose-500 text-white font-bold py-1.5 px-3 rounded-lg text-xs md:text-sm shadow-lg flex items-center gap-1 border border-rose-400/30">
                        <span>- Remove</span>
                    </button>
                </div>

                <!-- Progress & Score Display -->
                <div class="flex flex-col items-end gap-1">
                    <div id="progressText" class="font-pixel text-lg md:text-2xl text-yellow-400 glow-text-yellow">0%</div>
                    <div id="modeBadge" class="text-[10px] md:text-xs font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/40">NORMAL MODE</div>
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="w-full bg-slate-900/80 h-3 rounded-full border border-slate-700/50 overflow-hidden relative">
                <div id="progressBar" class="h-full bg-gradient-to-r from-cyan-500 via-yellow-400 to-pink-500 w-0 transition-all duration-75"></div>
            </div>
        </div>

        <!-- Main Menu Overlay -->
        <div id="mainMenuUI" class="absolute inset-0 z-20 flex flex-col items-center justify-between p-6 bg-slate-950/90 backdrop-blur-md">
            <!-- Title Header -->
            <div class="text-center mt-6">
                <h1 class="font-pixel text-3xl sm:text-5xl md:text-6xl text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 via-cyan-400 to-fuchsia-500 glow-text-cyan tracking-wider transform -rotate-1">
                    GEOMETRY DASH
                </h1>
                <p class="text-slate-400 text-xs sm:text-sm font-semibold tracking-widest uppercase mt-2">Web Edition • HTML5 Canvas Engine</p>
            </div>

            <!-- Main Level Selector Card -->
            <div class="w-full max-w-lg bg-slate-900/90 border border-slate-700/60 rounded-2xl p-6 shadow-2xl flex flex-col items-center gap-4 glow-box-purple">
                <div class="flex justify-between items-center w-full">
                    <button id="prevLevelBtn" class="p-3 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-xl transition font-bold text-xl">❮</button>
                    <div class="text-center">
                        <div id="levelNumber" class="text-xs font-bold text-cyan-400 tracking-widest uppercase">LEVEL 1</div>
                        <h2 id="levelTitle" class="text-2xl sm:text-3xl font-black text-white glow-text-yellow">STEREO MADNESS</h2>
                        <div id="levelDifficulty" class="text-xs font-bold text-emerald-400 mt-1">EASY ★☆☆☆☆</div>
                    </div>
                    <button id="nextLevelBtn" class="p-3 bg-slate-800 hover:bg-slate-700 text-cyan-400 rounded-xl transition font-bold text-xl">❯</button>
                </div>

                <!-- Best Attempt Stats -->
                <div class="w-full bg-slate-950/70 rounded-xl p-3 flex justify-around text-center text-xs border border-slate-800">
                    <div>
                        <div class="text-slate-400 uppercase tracking-wider text-[10px]">Normal Best</div>
                        <div id="statNormalBest" class="font-pixel text-yellow-400 text-sm mt-0.5">0%</div>
                    </div>
                    <div>
                        <div class="text-slate-400 uppercase tracking-wider text-[10px]">Practice Best</div>
                        <div id="statPracticeBest" class="font-pixel text-cyan-400 text-sm mt-0.5">0%</div>
                    </div>
                </div>

                <!-- Play Mode Buttons -->
                <div class="flex flex-col sm:flex-row gap-3 w-full mt-2">
                    <button id="btnPlayNormal" class="btn-neon flex-1 py-3.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black rounded-xl text-base tracking-wide shadow-lg uppercase flex justify-center items-center gap-2">
                        <span>▶ Play Normal</span>
                    </button>
                    <button id="btnPlayPractice" class="btn-neon flex-1 py-3.5 bg-gradient-to-r from-cyan-600 to-blue-700 hover:from-cyan-500 hover:to-blue-600 text-white font-black rounded-xl text-base tracking-wide shadow-lg uppercase flex justify-center items-center gap-2">
                        <span>💎 Practice</span>
                    </button>
                </div>
            </div>

            <!-- Bottom Customizer & Music Controls -->
            <div class="flex items-center gap-4 mb-2">
                <button id="btnAudioToggle" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 rounded-xl text-xs font-bold flex items-center gap-2">
                    <span id="audioIcon">🔊</span> Audio Enabled
                </button>
                <div class="text-slate-500 text-xs">Press Space/Click to Jump</div>
            </div>
        </div>

        <!-- Death / Pause / Complete Screen Overlay -->
        <div id="dialogOverlay" class="absolute inset-0 z-30 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center p-6 hidden">
            <div class="bg-slate-900 border border-slate-700/80 rounded-2xl p-6 sm:p-8 max-w-md w-full text-center shadow-2xl flex flex-col items-center">
                <h2 id="dialogTitle" class="font-pixel text-2xl sm:text-3xl text-rose-500 mb-2">CRASHED!</h2>
                <p id="dialogSubtitle" class="text-slate-400 text-sm mb-6">Attempt 12 • 45% Complete</p>
                
                <div class="w-full bg-slate-950 rounded-xl p-4 mb-6 border border-slate-800 flex justify-around">
                    <div>
                        <div class="text-slate-500 text-xs uppercase">Attempt Score</div>
                        <div id="dialogScore" class="font-pixel text-yellow-400 text-lg mt-1">45%</div>
                    </div>
                    <div>
                        <div class="text-slate-500 text-xs uppercase">Best Record</div>
                        <div id="dialogBest" class="font-pixel text-emerald-400 text-lg mt-1">68%</div>
                    </div>
                </div>

                <div class="flex gap-3 w-full">
                    <button id="btnDialogRestart" class="btn-neon flex-1 py-3 bg-gradient-to-r from-amber-500 to-yellow-500 text-slate-950 font-black rounded-xl text-sm uppercase">Try Again</button>
                    <button id="btnDialogMenu" class="btn-neon flex-1 py-3 bg-slate-800 hover:bg-slate-700 text-white font-bold rounded-xl text-sm uppercase">Level Select</button>
                </div>
            </div>
        </div>

    </div>

    <script>
        /* Geometry Dash Core Engine JavaScript */
        (function() {
            // --- CANVAS SETUP ---
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let canvasWidth = 1280;
            let canvasHeight = 720;

            function resizeCanvas() {
                const container = document.getElementById('gameContainer') || canvas.parentElement;
                const rect = container.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                canvasWidth = canvas.width;
                canvasHeight = canvas.height;
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // --- WEB AUDIO API SYNTHESIZER ---
            class AudioEngine {
                constructor() {
                    this.ctx = null;
                    this.isMuted = false;
                    this.bgMusicTimer = null;
                    this.beatCount = 0;
                }

                init() {
                    if (!this.ctx) {
                        const AudioCtx = window.AudioContext || window.webkitAudioContext;
                        this.ctx = new AudioCtx();
                    }
                    if (this.ctx.state === 'suspended') {
                        this.ctx.resume();
                    }
                }

                playJump() {
                    if (this.isMuted || !this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(150, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(600, this.ctx.currentTime + 0.12);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.12);
                }

                playPad() {
                    if (this.isMuted || !this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.2);
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.2);
                }

                playDeath() {
                    if (this.isMuted || !this.ctx) return;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, this.ctx.currentTime);
                    osc.frequency.linearRampToValueAtTime(40, this.ctx.currentTime + 0.25);
                    gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.25);
                }

                startMusic(bpm = 130) {
                    this.stopMusic();
                    if (this.isMuted) return;
                    this.init();
                    
                    const interval = (60 / bpm / 4) * 1000; // 16th notes
                    const synthScale = [130.81, 146.83, 164.81, 174.61, 196.00, 220.00, 246.94, 261.63]; // C Major
                    
                    this.beatCount = 0;
                    this.bgMusicTimer = setInterval(() => {
                        if (!this.ctx || gameState !== 'PLAYING') return;
                        const time = this.ctx.currentTime;
                        
                        // Kick synth on beat
                        if (this.beatCount % 4 === 0) {
                            const kick = this.ctx.createOscillator();
                            const kickGain = this.ctx.createGain();
                            kick.frequency.setValueAtTime(120, time);
                            kick.frequency.exponentialRampToValueAtTime(0.01, time + 0.1);
                            kickGain.gain.setValueAtTime(0.3, time);
                            kickGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);
                            kick.connect(kickGain);
                            kickGain.connect(this.ctx.destination);
                            kick.start(time);
                            kick.stop(time + 0.1);
                        }

                        // Arpeggiated synth melody
                        if (this.beatCount % 2 === 0) {
                            const synth = this.ctx.createOscillator();
                            const synthGain = this.ctx.createGain();
                            const noteIndex = (Math.floor(this.beatCount / 2) * 3) % synthScale.length;
                            synth.type = 'sawtooth';
                            synth.frequency.setValueAtTime(synthScale[noteIndex] * 2, time);
                            synthGain.gain.setValueAtTime(0.04, time);
                            synthGain.gain.exponentialRampToValueAtTime(0.001, time + 0.15);
                            synth.connect(synthGain);
                            synthGain.connect(this.ctx.destination);
                            synth.start(time);
                            synth.stop(time + 0.15);
                        }

                        this.beatCount++;
                    }, interval);
                }

                stopMusic() {
                    if (this.bgMusicTimer) {
                        clearInterval(this.bgMusicTimer);
                        this.bgMusicTimer = null;
                    }
                }
            }

            const audio = new AudioEngine();

            // --- CONSTANTS & GAMEMODES ---
            const GRID_SIZE = 45; // Pixel size of 1 block
            const GRAVITY_CONSTANT = 1.45;
            
            const MODE = {
                CUBE: 'CUBE',
                SHIP: 'SHIP',
                BALL: 'BALL',
                UFO: 'UFO',
                SPIDER: 'SPIDER'
            };

            const OBJECT_TYPES = {
                BLOCK: 1,
                SPIKE: 2,
                HALF_SPIKE: 3,
                PAD_YELLOW: 4,
                PAD_PURPLE: 5,
                ORB_YELLOW: 6,
                ORB_PURPLE: 7,
                PORTAL_SHIP: 8,
                PORTAL_CUBE: 9,
                PORTAL_GRAVITY_FLIP: 10,
                PORTAL_GRAVITY_NORMAL: 11
            };

            // Sample Preset Levels
            const LEVELS = [
                {
                    title: "STEREO MADNESS",
                    difficulty: "EASY ★☆☆☆☆",
                    bpm: 128,
                    bgGrad: ['#0f172a', '#1e1b4b'],
                    floorColor: '#06b6d4',
                    // Grid matrix generation helpers
                    data: generateLevel1()
                },
                {
                    title: "BACK ON TRACK",
                    difficulty: "MEDIUM ★★☆☆☆",
                    bpm: 135,
                    bgGrad: ['#1e1b4b', '#311042'],
                    floorColor: '#eab308',
                    data: generateLevel2()
                },
                {
                    title: "CYBER ENDLESS",
                    difficulty: "PROCEDURAL INFINITE",
                    bpm: 140,
                    bgGrad: ['#030712', '#111827'],
                    floorColor: '#ec4899',
                    procedural: true,
                    data: []
                }
            ];

            // Level Generators
            function generateLevel1() {
                const map = [];
                // Floor base padding
                for(let i = 0; i < 15; i++) {} 
                
                // Track objects: [type, x (grid), y (grid from bottom)]
                const layout = [
                    [1, 10, 0], [2, 18, 0], [2, 23, 0], [2, 24, 0],
                    [1, 30, 0], [1, 31, 0], [2, 31, 1], [1, 32, 0],
                    [4, 38, 0], [1, 42, 2], [1, 43, 2], [1, 44, 2],
                    [6, 50, 2], [2, 54, 0], [2, 55, 0], [2, 56, 0],
                    [8, 62, 2], // Ship Portal
                    [1, 70, 1], [1, 71, 3], [1, 72, 1], [1, 75, 4],
                    [9, 85, 2], // Cube Portal
                    [10, 92, 2], // Gravity Flip Portal
                    [1, 98, 4], [2, 98, 5], [1, 102, 4],
                    [11, 110, 2], // Gravity Normal
                    [4, 118, 0], [1, 122, 3], [2, 122, 4], [1, 126, 0], [2, 130, 0]
                ];

                layout.forEach(([type, x, y]) => {
                    map.push({ type, x: x * GRID_SIZE, y: y * GRID_SIZE });
                });
                return map;
            }

            function generateLevel2() {
                const map = [];
                const layout = [
                    [2, 12, 0], [4, 16, 0], [1, 20, 2], [6, 22, 3], [1, 25, 3],
                    [10, 32, 2], [1, 38, 2], [2, 38, 3], [11, 48, 2],
                    [8, 55, 2], [1, 62, 1], [1, 65, 4], [1, 68, 2],
                    [9, 78, 2], [4, 84, 0], [6, 89, 2], [2, 95, 0], [2, 96, 0]
                ];
                layout.forEach(([type, x, y]) => {
                    map.push({ type, x: x * GRID_SIZE, y: y * GRID_SIZE });
                });
                return map;
            }

            // --- GAME STATE VARIABLES ---
            let currentLevelIdx = 0;
            let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER, COMPLETED
            let isPracticeMode = false;
            let cameraX = 0;
            let levelLength = 6000;
            let attempts = 1;
            let checkpoints = [];

            // Storage for best scores
            const records = JSON.parse(localStorage.getItem('gd_records') || '{}');

            // Player Object
            const player = {
                x: 0,
                y: 0,
                vx: 6.2, // Movement Speed
                vy: 0,
                size: 36,
                rotation: 0,
                mode: MODE.CUBE,
                gravityDir: 1, // 1: normal (down), -1: flipped (up)
                isGrounded: false,
                isHoldingJump: false,
                trail: [],
                reset: function(x = 100, y = 0) {
                    this.x = x;
                    this.y = y;
                    this.vx = 6.2;
                    this.vy = 0;
                    this.rotation = 0;
                    this.mode = MODE.CUBE;
                    this.gravityDir = 1;
                    this.isGrounded = false;
                    this.trail = [];
                }
            };

            // Active Game Entities & Particles
            let levelObjects = [];
            let particles = [];

            // Particle Generator
            function spawnParticles(x, y, color, count = 15) {
                for(let i = 0; i < count; i++) {
                    particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 12,
                        vy: (Math.random() - 0.5) * 12,
                        size: Math.random() * 6 + 2,
                        color: color,
                        alpha: 1,
                        life: 1
                    });
                }
            }

            function updateParticles() {
                for(let i = particles.length - 1; i >= 0; i--) {
                    const p = particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.alpha -= 0.03;
                    p.life -= 0.03;
                    if (p.alpha <= 0) {
                        particles.splice(i, 1);
                    }
                }
            }

            function drawParticles() {
                particles.forEach(p => {
                    ctx.save();
                    ctx.globalAlpha = Math.max(0, p.alpha);
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x - cameraX, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                });
            }

            // --- USER INPUT CONTROLS ---
            function triggerJump() {
                if (gameState !== 'PLAYING') return;

                const g = player.gravityDir;

                if (player.mode === MODE.CUBE) {
                    if (player.isGrounded) {
                        player.vy = -14.5 * g;
                        player.isGrounded = false;
                        audio.playJump();
                        spawnParticles(player.x, player.y + (g === 1 ? player.size : 0), '#facc15', 8);
                    }
                } else if (player.mode === MODE.SHIP) {
                    player.vy -= 1.2 * g;
                }
            }

            window.addEventListener('keydown', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp') {
                    player.isHoldingJump = true;
                    audio.init();
                    triggerJump();
                    e.preventDefault();
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'Space' || e.code === 'ArrowUp') {
                    player.isHoldingJump = false;
                }
            });

            // Touch / Mouse interaction
            const gameContainer = document.getElementById('game-container');
            gameContainer.addEventListener('mousedown', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                player.isHoldingJump = true;
                audio.init();
                triggerJump();
            });

            window.addEventListener('mouseup', () => {
                player.isHoldingJump = false;
            });

            gameContainer.addEventListener('touchstart', (e) => {
                if (e.target.tagName === 'BUTTON') return;
                player.isHoldingJump = true;
                audio.init();
                triggerJump();
            }, { passive: true });

            window.addEventListener('touchend', () => {
                player.isHoldingJump = false;
            });

            // --- LEVEL LOADER & INITIALIZER ---
            function loadLevel(idx) {
                currentLevelIdx = idx;
                const level = LEVELS[idx];
                
                document.getElementById('levelNumber').innerText = `LEVEL ${idx + 1}`;
                document.getElementById('levelTitle').innerText = level.title;
                document.getElementById('levelDifficulty').innerText = level.difficulty;

                const recKey = `level_${idx}`;
                const saved = records[recKey] || { normal: 0, practice: 0 };
                document.getElementById('statNormalBest').innerText = `${saved.normal}%`;
                document.getElementById('statPracticeBest').innerText = `${saved.practice}%`;

                if (level.procedural) {
                    levelObjects = generateProceduralObjects(10000);
                    levelLength = 10000;
                } else {
                    levelObjects = JSON.parse(JSON.stringify(level.data));
                    const maxX = Math.max(...levelObjects.map(o => o.x), 3000);
                    levelLength = maxX + 800;
                }
            }

            function generateProceduralObjects(length) {
                const objs = [];
                let currX = 600;
                while (currX < length) {
                    const rand = Math.random();
                    if (rand < 0.3) {
                        objs.push({ type: OBJECT_TYPES.SPIKE, x: currX, y: 0 });
                        currX += GRID_SIZE * 3;
                    } else if (rand < 0.6) {
                        objs.push({ type: OBJECT_TYPES.BLOCK, x: currX, y: 0 });
                        if (Math.random() > 0.5) {
                            objs.push({ type: OBJECT_TYPES.SPIKE, x: currX, y: GRID_SIZE });
                        }
                        currX += GRID_SIZE * 2;
                    } else if (rand < 0.8) {
                        objs.push({ type: OBJECT_TYPES.PAD_YELLOW, x: currX, y: 0 });
                        objs.push({ type: OBJECT_TYPES.BLOCK, x: currX + GRID_SIZE * 2, y: GRID_SIZE * 2 });
                        currX += GRID_SIZE * 4;
                    } else {
                        objs.push({ type: OBJECT_TYPES.PORTAL_GRAVITY_FLIP, x: currX, y: GRID_SIZE * 2 });
                        currX += GRID_SIZE * 5;
                    }
                }
                return objs;
            }

            function startGame(practiceMode = false) {
                isPracticeMode = practiceMode;
                gameState = 'PLAYING';
                checkpoints = [];
                attempts = 1;

                player.reset(100, 0);
                cameraX = 0;
                particles = [];

                document.getElementById('mainMenuUI').classList.add('hidden');
                document.getElementById('dialogOverlay').classList.add('hidden');
                document.getElementById('inGameUI').classList.remove('hidden');
                
                const practiceControls = document.getElementById('practiceControls');
                const modeBadge = document.getElementById('modeBadge');
                if (isPracticeMode) {
                    practiceControls.classList.remove('hidden');
                    modeBadge.innerText = "PRACTICE MODE";
                    modeBadge.className = "text-[10px] md:text-xs font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300 border border-emerald-500/40";
                } else {
                    practiceControls.classList.add('hidden');
                    modeBadge.innerText = "NORMAL MODE";
                    modeBadge.className = "text-[10px] md:text-xs font-bold uppercase tracking-wider px-2 py-0.5 rounded bg-cyan-500/20 text-cyan-300 border border-cyan-500/40";
                }

                audio.startMusic(LEVELS[currentLevelIdx].bpm || 130);
            }

            function playerDie() {
                audio.playDeath();
                spawnParticles(player.x + player.size/2, player.y + player.size/2, '#ef4444', 30);

                if (isPracticeMode && checkpoints.length > 0) {
                    // Restore last checkpoint
                    const cp = checkpoints[checkpoints.length - 1];
                    player.x = cp.x;
                    player.y = cp.y;
                    player.vy = cp.vy;
                    player.gravityDir = cp.gravityDir;
                    player.mode = cp.mode;
                    cameraX = player.x - 200;
                    return;
                }

                // Normal Mode Game Over
                gameState = 'GAMEOVER';
                audio.stopMusic();

                const currentPercent = Math.min(100, Math.floor((player.x / levelLength) * 100));
                
                // Save Record
                const recKey = `level_${currentLevelIdx}`;
                if (!records[recKey]) records[recKey] = { normal: 0, practice: 0 };
                
                if (isPracticeMode) {
                    records[recKey].practice = Math.max(records[recKey].practice, currentPercent);
                } else {
                    records[recKey].normal = Math.max(records[recKey].normal, currentPercent);
                }
                localStorage.setItem('gd_records', JSON.stringify(records));

                setTimeout(() => {
                    document.getElementById('dialogTitle').innerText = "CRASHED!";
                    document.getElementById('dialogTitle').className = "font-pixel text-2xl sm:text-3xl text-rose-500 mb-2";
                    document.getElementById('dialogSubtitle').innerText = `Attempt ${attempts} • ${currentPercent}% Completed`;
                    document.getElementById('dialogScore').innerText = `${currentPercent}%`;
                    document.getElementById('dialogBest').innerText = `${records[recKey].normal}%`;
                    document.getElementById('dialogOverlay').classList.remove('hidden');
                }, 400);
            }

            function completeLevel() {
                gameState = 'COMPLETED';
                audio.stopMusic();

                const recKey = `level_${currentLevelIdx}`;
                if (!records[recKey]) records[recKey] = { normal: 0, practice: 0 };
                records[recKey].normal = 100;
                localStorage.setItem('gd_records', JSON.stringify(records));

                document.getElementById('dialogTitle').innerText = "LEVEL COMPLETE!";
                document.getElementById('dialogTitle').className = "font-pixel text-2xl sm:text-3xl text-emerald-400 mb-2 glow-text-cyan";
                document.getElementById('dialogSubtitle').innerText = `Great Job! 100% Cleared!`;
                document.getElementById('dialogScore').innerText = `100%`;
                document.getElementById('dialogBest').innerText = `100%`;
                document.getElementById('dialogOverlay').classList.remove('hidden');
            }

            // --- PHYSICS & COLLISION CALCULATIONS ---
            function updatePhysics() {
                if (gameState !== 'PLAYING') return;

                const floorY = canvasHeight - 120; // Y base line for floor ground
                const g = player.gravityDir;

                // Move Player Horizontally
                player.x += player.vx;
                cameraX = player.x - 200; // Camera follow offset

                // Continuous jump holding check for Ship / Cube
                if (player.isHoldingJump) {
                    if (player.mode === MODE.SHIP) {
                        player.vy -= 0.65 * g;
                    } else if (player.mode === MODE.CUBE && player.isGrounded) {
                        triggerJump();
                    }
                }

                // Apply Mode Specific Gravity
                if (player.mode === MODE.CUBE) {
                    player.vy += GRAVITY_CONSTANT * g;
                } else if (player.mode === MODE.SHIP) {
                    player.vy += GRAVITY_CONSTANT * 0.45 * g;
                    // Cap ship velocity
                    player.vy = Math.max(-9, Math.min(9, player.vy));
                }

                player.y += player.vy;

                // Ground and Ceiling World Boundaries
                let onGround = false;
                const playerBottom = player.y + player.size;
                const playerTop = player.y;

                if (g === 1) { // Normal Gravity
                    if (playerBottom >= floorY) {
                        player.y = floorY - player.size;
                        player.vy = 0;
                        onGround = true;
                    }
                } else { // Flipped Gravity
                    if (playerTop <= 80) { // Top Ceiling
                        player.y = 80;
                        player.vy = 0;
                        onGround = true;
                    }
                }

                player.isGrounded = onGround;

                // Cube Rotation Logic
                if (player.mode === MODE.CUBE) {
                    if (!player.isGrounded) {
                        player.rotation += 8 * g;
                    } else {
                        // Snap rotation to nearest 90 deg when landed
                        player.rotation = Math.round(player.rotation / 90) * 90;
                    }
                } else if (player.mode === MODE.SHIP) {
                    player.rotation = player.vy * 3;
                }

                // Add to trail effect
                if (Math.random() > 0.3) {
                    player.trail.push({ x: player.x, y: player.y, alpha: 0.6 });
                    if (player.trail.length > 8) player.trail.shift();
                }

                // Check Collisions with Objects
                const pRect = {
                    left: player.x + 4,
                    right: player.x + player.size - 4,
                    top: player.y + 4,
                    bottom: player.y + player.size - 4
                };

                for (let i = 0; i < levelObjects.length; i++) {
                    const obj = levelObjects[i];
                    // Object World Coordinates
                    const objX = obj.x;
                    const objY = g === 1 ? (floorY - obj.y - GRID_SIZE) : (80 + obj.y);

                    // Skip objects far offscreen
                    if (objX < player.x - 200 || objX > player.x + 1000) continue;

                    const oRect = {
                        left: objX,
                        right: objX + GRID_SIZE,
                        top: objY,
                        bottom: objY + GRID_SIZE
                    };

                    // Simple AABB bounding check
                    if (pRect.right > oRect.left && pRect.left < oRect.right &&
                        pRect.bottom > oRect.top && pRect.top < oRect.bottom) {

                        // Handle Collision types
                        if (obj.type === OBJECT_TYPES.SPIKE) {
                            playerDie();
                            return;
                        } else if (obj.type === OBJECT_TYPES.BLOCK) {
                            // Determine top landing vs side crash
                            const prevBottom = (player.y - player.vy) + player.size;
                            const prevTop = player.y - player.vy;

                            if (g === 1 && prevBottom <= oRect.top + 12) {
                                // Land on top of block
                                player.y = oRect.top - player.size;
                                player.vy = 0;
                                player.isGrounded = true;
                            } else if (g === -1 && prevTop >= oRect.bottom - 12) {
                                // Land on bottom of block (flipped)
                                player.y = oRect.bottom;
                                player.vy = 0;
                                player.isGrounded = true;
                            } else {
                                // Side collision = Death
                                playerDie();
                                return;
                            }
                        } else if (obj.type === OBJECT_TYPES.PAD_YELLOW) {
                            player.vy = -18 * g;
                            audio.playPad();
                            spawnParticles(player.x, player.y, '#facc15', 12);
                        } else if (obj.type === OBJECT_TYPES.PORTAL_GRAVITY_FLIP) {
                            player.gravityDir = -1;
                        } else if (obj.type === OBJECT_TYPES.PORTAL_GRAVITY_NORMAL) {
                            player.gravityDir = 1;
                        } else if (obj.type === OBJECT_TYPES.PORTAL_SHIP) {
                            player.mode = MODE.SHIP;
                        } else if (obj.type === OBJECT_TYPES.PORTAL_CUBE) {
                            player.mode = MODE.CUBE;
                        }
                    }
                }

                // Update UI Progress Percentage Bar
                const currentPercent = Math.min(100, Math.floor((player.x / levelLength) * 100));
                document.getElementById('progressText').innerText = `${currentPercent}%`;
                document.getElementById('progressBar').style.width = `${currentPercent}%`;

                // Win Condition Check
                if (player.x >= levelLength) {
                    completeLevel();
                }
            }

            // --- RENDER ENGINE ---
            function render() {
                const level = LEVELS[currentLevelIdx];
                const floorY = canvasHeight - 120;

                // 1. Draw Background Gradient
                const grad = ctx.createLinearGradient(0, 0, 0, canvasHeight);
                grad.addColorStop(0, level.bgGrad[0]);
                grad.addColorStop(1, level.bgGrad[1]);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, canvasWidth, canvasHeight);

                // Grid lines background effect
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                ctx.lineWidth = 1;
                const gridOffset = (cameraX * 0.3) % 60;
                for (let x = -gridOffset; x < canvasWidth; x += 60) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, canvasHeight);
                    ctx.stroke();
                }

                // 2. Draw Floor & Ceiling
                ctx.fillStyle = level.floorColor;
                ctx.shadowColor = level.floorColor;
                ctx.shadowBlur = 15;
                ctx.fillRect(0, floorY, canvasWidth, 120);
                ctx.fillRect(0, 0, canvasWidth, 80); // Ceiling bar
                ctx.shadowBlur = 0; // Reset glow

                // Top border line for ground
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, floorY);
                ctx.lineTo(canvasWidth, floorY);
                ctx.moveTo(0, 80);
                ctx.lineTo(canvasWidth, 80);
                ctx.stroke();

                // 3. Draw Level Objects
                levelObjects.forEach(obj => {
                    const screenX = obj.x - cameraX;
                    const screenY = player.gravityDir === 1 ? (floorY - obj.y - GRID_SIZE) : (80 + obj.y);

                    // Offscreen Culling
                    if (screenX < -GRID_SIZE || screenX > canvasWidth + GRID_SIZE) return;

                    ctx.save();
                    if (obj.type === OBJECT_TYPES.SPIKE) {
                        // Neon Triangle Spike
                        ctx.fillStyle = '#f43f5e';
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(screenX, screenY + GRID_SIZE);
                        ctx.lineTo(screenX + GRID_SIZE / 2, screenY);
                        ctx.lineTo(screenX + GRID_SIZE, screenY + GRID_SIZE);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();
                    } else if (obj.type === OBJECT_TYPES.BLOCK) {
                        // Cyan Glowing Block
                        ctx.fillStyle = '#0f172a';
                        ctx.strokeStyle = '#06b6d4';
                        ctx.lineWidth = 3;
                        ctx.fillRect(screenX, screenY, GRID_SIZE, GRID_SIZE);
                        ctx.strokeRect(screenX, screenY, GRID_SIZE, GRID_SIZE);
                        // Inner pattern
                        ctx.strokeStyle = '#06b6d4';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(screenX + 8, screenY + 8, GRID_SIZE - 16, GRID_SIZE - 16);
                    } else if (obj.type === OBJECT_TYPES.PAD_YELLOW) {
                        // Yellow Jump Pad
                        ctx.fillStyle = '#eab308';
                        ctx.fillRect(screenX + 4, screenY + GRID_SIZE - 10, GRID_SIZE - 8, 10);
                    } else if (obj.type === OBJECT_TYPES.PORTAL_GRAVITY_FLIP || obj.type === OBJECT_TYPES.PORTAL_GRAVITY_NORMAL) {
                        // Gravity Portal Ring
                        const isFlip = obj.type === OBJECT_TYPES.PORTAL_GRAVITY_FLIP;
                        ctx.strokeStyle = isFlip ? '#a855f7' : '#3b82f6';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.ellipse(screenX + GRID_SIZE/2, screenY + GRID_SIZE/2, 15, 30, 0, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    ctx.restore();
                });

                // 4. Draw Player Trail
                player.trail.forEach((t, i) => {
                    ctx.save();
                    ctx.fillStyle = `rgba(250, 204, 21, ${t.alpha * (i / player.trail.length)})`;
                    ctx.fillRect(t.x - cameraX, t.y, player.size, player.size);
                    ctx.restore();
                });

                // 5. Draw Player Cube / Ship
                if (gameState === 'PLAYING') {
                    ctx.save();
                    const px = player.x - cameraX + player.size / 2;
                    const py = player.y + player.size / 2;
                    ctx.translate(px, py);
                    ctx.rotate((player.rotation * Math.PI) / 180);

                    if (player.mode === MODE.CUBE) {
                        // Player Cube Style
                        ctx.fillStyle = '#facc15'; // Main Icon Yellow
                        ctx.fillRect(-player.size / 2, -player.size / 2, player.size, player.size);
                        
                        // Eyes / Inner Face Pattern
                        ctx.fillStyle = '#09090b';
                        ctx.fillRect(-player.size / 4, -player.size / 4, 8, 8);
                        ctx.fillRect(player.size / 4 - 8, -player.size / 4, 8, 8);
                        ctx.fillRect(-player.size / 4, player.size / 6, player.size / 2, 4);

                        // Outer Cyan Border
                        ctx.strokeStyle = '#06b6d4';
                        ctx.lineWidth = 3;
                        ctx.strokeRect(-player.size / 2, -player.size / 2, player.size, player.size);
                    } else if (player.mode === MODE.SHIP) {
                        // Player Ship Mode
                        ctx.fillStyle = '#ec4899';
                        ctx.beginPath();
                        ctx.moveTo(-player.size / 2, player.size / 4);
                        ctx.lineTo(player.size / 2, 0);
                        ctx.lineTo(-player.size / 2, -player.size / 4);
                        ctx.closePath();
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }

                    ctx.restore();
                }

                // 6. Draw Particle Explosion Effects
                updateParticles();
                drawParticles();
            }

            // --- MAIN GAME LOOP ---
            function gameLoop() {
                updatePhysics();
                render();
                requestAnimationFrame(gameLoop);
            }

            // --- UI BUTTON HANDLERS ---
            document.getElementById('btnPlayNormal').addEventListener('click', () => startGame(false));
            document.getElementById('btnPlayPractice').addEventListener('click', () => startGame(true));
            
            document.getElementById('prevLevelBtn').addEventListener('click', () => {
                currentLevelIdx = (currentLevelIdx - 1 + LEVELS.length) % LEVELS.length;
                loadLevel(currentLevelIdx);
            });

            document.getElementById('nextLevelBtn').addEventListener('click', () => {
                currentLevelIdx = (currentLevelIdx + 1) % LEVELS.length;
                loadLevel(currentLevelIdx);
            });

            document.getElementById('btnDialogRestart').addEventListener('click', () => {
                attempts++;
                startGame(isPracticeMode);
            });

            document.getElementById('btnDialogMenu').addEventListener('click', () => {
                gameState = 'MENU';
                document.getElementById('dialogOverlay').classList.add('hidden');
                document.getElementById('inGameUI').classList.add('hidden');
                document.getElementById('mainMenuUI').classList.remove('hidden');
                loadLevel(currentLevelIdx);
            });

            document.getElementById('btnCheckpoint').addEventListener('click', () => {
                if (isPracticeMode && gameState === 'PLAYING') {
                    checkpoints.push({
                        x: player.x,
                        y: player.y,
                        vy: player.vy,
                        gravityDir: player.gravityDir,
                        mode: player.mode
                    });
                    spawnParticles(player.x, player.y, '#10b981', 15);
                }
            });

            document.getElementById('btnRemoveCheckpoint').addEventListener('click', () => {
                if (isPracticeMode) {
                    checkpoints.pop();
                }
            });

            document.getElementById('btnAudioToggle').addEventListener('click', () => {
                audio.isMuted = !audio.isMuted;
                document.getElementById('audioIcon').innerText = audio.isMuted ? '🔇' : '🔊';
                document.getElementById('btnAudioToggle').innerHTML = `<span id="audioIcon">${audio.isMuted ? '🔇' : '🔊'}</span> Audio ${audio.isMuted ? 'Disabled' : 'Enabled'}`;
                if (audio.isMuted) audio.stopMusic();
                else if (gameState === 'PLAYING') audio.startMusic(LEVELS[currentLevelIdx].bpm);
            });

            // Initialize level menu on boot
            loadLevel(0);
            
            // Start main animation loop on page load
            window.onload = function() {
                gameLoop();
            };

        })();
    </script>
</body>
